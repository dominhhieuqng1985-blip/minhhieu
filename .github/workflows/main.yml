name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Chạy khi có code mới đẩy lên nhánh main hoặc master
  schedule:
    - cron: '0 */4 * * *' # Tự động chạy mỗi 4 tiếng để cập nhật video mới từ YouTube
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: npm install

      - name: Sync latest YouTube videos & studo.xml
        run: node scripts/sync-channel.cjs

      - name: Commit updated channel data and studo.xml
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/minhhieuChannelData.ts public/studo.xml public/studio.xml
          git diff --staged --quiet || (git commit -m "chore(auto-sync): update YouTube videos & studo.xml [skip ci]" && git push) || echo "No changes or push skipped"
        
      - name: Build
        run: npm run build
        env:
          # Dòng này sẽ lấy API Key từ Bước 1 bạn đã cài để đưa vào web
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
