
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Sync latest YouTube videos and RSS/XML
        run: |
          if [ -f scripts/sync-channel.cjs ]; then
            node scripts/sync-channel.cjs
          else
            echo "::error::Missing scripts/sync-channel.cjs"
            exit 1
          fi

      - name: Commit updated channel data and RSS/XML
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            src/data/minhhieuChannelData.ts \
            public/studo.xml \
            public/studio.xml \
            public/feed.xml \
            public/rss.xml \
            public/ad-settings.json \
            public/CNAME

          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-sync): update YouTube channel data [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Git push warning: Please ensure 'Read and write permissions' is enabled in Settings > Actions > General on GitHub."
          else
            echo "No channel or RSS/XML changes detected."
          fi

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || secrets.VITE_BACKEND_URL }}

      - name: Verify build output
        run: |
          if [ ! -d dist ]; then
            echo "::error::Build did not create the dist directory."
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::The dist directory is empty."
            exit 1
          fi
          echo "Build output verified."
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
