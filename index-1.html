    <style>
      :root {
        --bg-color: #f3f4f6; /* Lighter gray for better contrast with white cards */
        --text-color: #1f2937;
        --card-bg-color: #ffffff;
        --border-color: #e5e7eb;
      }

      .dark {
         --bg-color: #0f172a; /* Deep dark blue-gray */
        --text-color: #f9fafb;
        --card-bg-color: #1e293b;
        --border-color: #374151;
      }
      
      body {
        background-color: var(--bg-color);
        /* Subtle mesh/noise for texture */
        background-image: 
            radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 50%), 
            radial-gradient(at 100% 0%, rgba(239, 68, 68, 0.03) 0px, transparent 50%);
        background-attachment: fixed;
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
        min-height: 100vh;
      }

      @media print {
        body * {
          visibility: hidden;
        }
        .ticket-to-print, .ticket-to-print * {
          visibility: visible;
        }
        .ticket-to-print {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
        .no-print {
            display: none !important;
        }
        /* Handle modal container for printing */
        .ticket-modal-container {
            visibility: visible !important;
            position: static !important;
            background-color: transparent !important;
        }
        .ticket-modal-container > div, .ticket-modal-content {
            visibility: visible !important;
            overflow: visible !important;
            height: auto !important;
            max-height: none !important;
            box-shadow: none !important;
        }
      }
      
      /* Leaflet specific fixes for dark mode tiles if needed */
      .leaflet-container {
        background: #0f172a;
      }
    </style>
